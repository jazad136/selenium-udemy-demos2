<html>
<head>
<title>Test Alerts | Practice Test Automation</title>
<link href="bootstrap-5.3.8-dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    .calendar-container {
        max-width: 800px;
        margin: 50px auto;
        background: #ffffff;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        padding: 20px;
    }
    .calendar-table th {
        text-align: center;
        padding: 12px 0;
        color: #6c757d;
        font-weight: 600;
    }
    .calendar-table td {
        height: 90px;
        width: 14.28%;
        vertical-align: top;
        padding: 6px;
        position: relative;
        border: 1px solid #dee2e6;
    }
    .calendar-table td:hover {
        background-color: #f8f9fa;
        cursor: pointer;
    }
    .day-number {
        font-weight: 500;
        display: inline-block;
        width: 28px;
        height: 28px;
        line-height: 28px;
        text-align: center;
        border-radius: 50%;
    }
    .today .day-number {
        background-color: #0d6efd;
        color: #ffffff;
    }
    .other-month {
        color: #ccc !important;
        background-color: #fafafa;
    }
    .event-badge {
        font-size: 0.75rem;
        padding: 4px 6px;
        border-radius: 4px;
        margin-top: 4px;
        display: block;
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
    }
</style>
</head>
<body>
<h2 style="text-align: center">Here is a calendar</h2>
    <div class="container">
    <div class="calendar-container">
        <!-- Calendar Header Navigation -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 id="monthYearTitle" class="mb-0 fw-bold text-dark"></h2>
            <div class="btn-group">
                <button id="prevMonthBtn" class="btn btn-outline-secondary">
                    <i class="bi bi-chevron-left"></i> Prev
                </button>
                <button id="todayBtn" class="btn btn-outline-primary">Today</button>
                <button id="nextMonthBtn" class="btn btn-outline-secondary">
                    Next <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- Calendar Grid -->
        <div class="table-responsive">
            <table class="table table-bordered calendar-table m-0">
                <thead>
                    <tr>
                        <th>Sunday</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                        <th>Saturday</th>
                    </tr>
                </thead>
                <tbody id="calendarBody">
                    <!-- Days will be injected dynamically via jQuery -->
                </tbody>
            </table>
        </div>
    
    <h2 style="text-align: center">Here is another calendar</h2>
    <div class="container">
    <div class="calendar-container">
        <!-- Calendar Header Navigation -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 id="monthYearTitle2" class="mb-0 fw-bold text-dark"></h2>
            <div class="btn-group">
                <button id="prevMonthBtn2" class="btn btn-outline-secondary">
                    <i class="bi bi-chevron-left"></i> Prev
                </button>
                <button id="todayBtn2" class="btn btn-outline-primary">Today</button>
                <button id="nextMonthBtn2" class="btn btn-outline-secondary">
                    Next <i class="bi bi-chevron-right"></i>
                </button>
            </div>
        </div>

        <!-- Calendar Grid -->
        <div class="table-responsive">
            <table class="table table-bordered calendar-table m-0">
                <thead>
                    <tr>
                        <th>Sunday</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                        <th>Saturday</th>
                    </tr>
                </thead>
                <tbody id="calendarBody2">
                    <!-- Days will be injected dynamically via jQuery -->
                </tbody>
            </table>
        </div>
    </div>
</div>
<script src="bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js"></script>
<script id="jquery-core-js" src="./jquery-4.0.0/jquery4_0_0.min.js"></script>
<script>
$(document).ready(function() {
    // Current date tracking state
    let currentDate = new Date();
    let currentDate2 = new Date();
    
    // Sample dummy events object keyed by date string (YYYY-MM-DD)
    const sampleEvents = {
        [`${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}-15`]: [
            { title: "Project Review", class: "bg-success-subtle text-success" }
        ],
        [`${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}-20`]: [
            { title: "Team Lunch", class: "bg-warning-subtle text-warning-emphasis" },
            { title: "Design Sync", class: "bg-info-subtle text-info-emphasis" }
        ]
        ,['2026-09-16']:[{title: 'Team Dinner', class: 'bg-success-subtle text-success'}]
        ,['2026-10-16']:[{title: 'Jonathan Saddler', class: 'bg-success-subtle text-success'}]
    };
    const sampleEvents2 = {
        [`${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}-15`]: [
            { title: "Project Review", class: "bg-success-subtle text-success" }
        ],
        [`${new Date().getFullYear()}-${String(new Date().getMonth() + 1).padStart(2, '0')}-20`]: [
            { title: "Team Lunch", class: "bg-warning-subtle text-warning-emphasis" },
            { title: "Design Sync", class: "bg-info-subtle text-info-emphasis" }
        ]
        ,['2026-09-16']:[{title: 'Team Dinner', class: 'bg-success-subtle text-success'}]
    };

    function renderCalendar(date) {
        const year = date.getFullYear();
        const month = date.getMonth();

        // Array of month names
        const monthNames = ["January", "February", "March", "April", "May", "June", 
                            "July", "August", "September", "October", "November", "December"];
        
        // Set Header Title
        $("#monthYearTitle").text(`${monthNames[month]} ${year}`);

        // Get first day of the month and total days in the month
        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        
        // Days in previous month to fill the starting blank gaps
        const prevTotalDays = new Date(year, month, 0).getDate();

        let htmlRows = "";
        let dayCounter = 1;
        let nextMonthDayCounter = 1;

        // Today's date components for checking
        const today = new Date();

        // 6 rows max coverage for any given month calendar grid
        for (let i = 0; i < 6; i++) {
            let rowCells = "<tr>";

            for (let j = 0; j < 7; j++) {
                const cellIndex = i * 7 + j;

                if (cellIndex < firstDayIndex) {
                    // Days from the previous month
                    const prevDay = prevTotalDays - firstDayIndex + cellIndex + 1;
                    rowCells += `<td class="other-month"><span class="day-number">${prevDay}</span></td>`;
                } else if (dayCounter > totalDays) {
                    // Days from the next month
                    rowCells += `<td class="other-month"><span class="day-number">${nextMonthDayCounter}</span></td>`;
                    nextMonthDayCounter++;
                } else {
                    // Current month days
                    let dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayCounter).padStart(2, '0')}`;
                    let isToday = today.getDate() === dayCounter && today.getMonth() === month && today.getFullYear() === year ? "today" : "";
                    
                    rowCells += `<td class="${isToday}" data-date="${dateString}">`;
                    rowCells += `<span class="day-number">${dayCounter}</span>`;

                    // Inject events if they match this specific calendar day
                    if (sampleEvents[dateString]) {
                        sampleEvents[dateString].forEach(event => {
                            rowCells += `<div class="event-badge ${event.class}">${event.title}</div>`;
                        });
                    }

                    rowCells += `</td>`;
                    dayCounter++;
                }
            }

            rowCells += "</tr>";
            htmlRows += rowCells;

            // Break loop early if all days of the month are fully printed
            if (dayCounter > totalDays && nextMonthDayCounter > 1) {
                // Ensure we finish rendering the remainder of the current row grid line
                break;
            }
        }

        $("#calendarBody").html(htmlRows);
    }
    function renderCalendar2(date) {
        const year = date.getFullYear();
        const month = date.getMonth();

        // Array of month names
        const monthNames = ["January", "February", "March", "April", "May", "June", 
                            "July", "August", "September", "October", "November", "December"];
        
        // Set Header Title
        $("#monthYearTitle2").text(`${monthNames[month]} ${year}`);

        // Get first day of the month and total days in the month
        const firstDayIndex = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();
        
        // Days in previous month to fill the starting blank gaps
        const prevTotalDays = new Date(year, month, 0).getDate();

        let htmlRows = "";
        let dayCounter = 1;
        let nextMonthDayCounter = 1;

        // Today's date components for checking
        const today = new Date();

        // 6 rows max coverage for any given month calendar grid
        for (let i = 0; i < 6; i++) {
            let rowCells = "<tr>";

            for (let j = 0; j < 7; j++) {
                const cellIndex = i * 7 + j;

                if (cellIndex < firstDayIndex) {
                    // Days from the previous month
                    const prevDay = prevTotalDays - firstDayIndex + cellIndex + 1;
                    rowCells += `<td class="other-month"><span class="day-number">${prevDay}</span></td>`;
                } else if (dayCounter > totalDays) {
                    // Days from the next month
                    rowCells += `<td class="other-month"><span class="day-number">${nextMonthDayCounter}</span></td>`;
                    nextMonthDayCounter++;
                } else {
                    // Current month days
                    let dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(dayCounter).padStart(2, '0')}`;
                    let isToday = today.getDate() === dayCounter && today.getMonth() === month && today.getFullYear() === year ? "today" : "";
                    
                    rowCells += `<td class="${isToday}" data-date="${dateString}">`;
                    rowCells += `<span class="day-number">${dayCounter}</span>`;

                    // Inject events if they match this specific calendar day
                    if (sampleEvents2[dateString]) {
                        sampleEvents2[dateString].forEach(event => {
                            rowCells += `<div class="event-badge ${event.class}">${event.title}</div>`;
                        });
                    }

                    rowCells += `</td>`;
                    dayCounter++;
                }
            }

            rowCells += "</tr>";
            htmlRows += rowCells;

            // Break loop early if all days of the month are fully printed
            if (dayCounter > totalDays && nextMonthDayCounter > 1) {
                // Ensure we finish rendering the remainder of the current row grid line
                break;
            }
        }

        $("#calendarBody2").html(htmlRows);
    }

    // Navigation Cal 1 Handlers
    $("#prevMonthBtn").click(function() {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar(currentDate);
    });

    $("#nextMonthBtn").click(function() {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar(currentDate);
    });

    $("#todayBtn2").click(function() {
        currentDate2 = new Date();
        renderCalendar2(currentDate2);
    });
    // Navigation Cal 2 Handlers
    $("#prevMonthBtn2").click(function() {
        currentDate2.setMonth(currentDate2.getMonth() - 1);
        renderCalendar2(currentDate2);
    });

    $("#nextMonthBtn2").click(function() {
        currentDate2.setMonth(currentDate2.getMonth() + 1);
        renderCalendar2(currentDate2);
    });

    $("#todayBtn2").click(function() {
        currentDate2 = new Date();
        renderCalendar2(currentDate2);
    });

    // Handle day click activity
    $(document).on("click", ".calendar-table td:not(.other-month)", function() {
        let selectedDate = $(this).data("date");
        alert("You clicked on date: " + selectedDate);
    });

    // Initial Trigger
    renderCalendar(currentDate);
    renderCalendar2(currentDate2);
});
</script>
</body>
</html>
